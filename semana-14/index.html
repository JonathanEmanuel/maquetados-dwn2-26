<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Transformaciones</h1>
        <input class="buscar" type="search" placeholder="Buscar...">

    </header>

    <main>
        <div class="box box-1">1 translate</div>
        <div class="box box-2">2 rotate</div>
        <div class="box box-3">3 RotateX</div>
        <div class="box rotateY"> RotateY</div>
        <div class="box scale"> Scale</div>
        <div class="box scaleX"> Scale X</div>
        <div class="box scaleY"> Scale Y</div>
        <div class="box skew"> Skew</div>

        <div class="box skewK"> Skew K</div>

        <div class="box skewY"> Skew Y</div>
        <div class="box mix"> Scale + Skew </div>

        <div class="box height"> Alto</div>

        <div class="box zoom"> Zoom</div>

        <div class="box zoom-color"> Zoom + color</div>

    </main>
    <footer>
        <p> EMAE | Maquetado y Desarrollo Web | 2026</p>
    </footer>
</body>
</html>
